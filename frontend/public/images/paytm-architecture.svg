<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="PAYTM Clone - Digital Wallet and Payment architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1524"/>
      <stop offset="100%" stop-color="#181033"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b7ff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8eff"/>
      <stop offset="100%" stop-color="#9966ff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00b7ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="430" rx="20" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">PAYTM</text>
  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9aa3b5">Digital Wallet &amp; Payment Application</text>

  <!-- User -->
  <rect x="28" y="125" width="120" height="62" rx="12" fill="#1c2333" stroke="#00b7ff" stroke-width="2"/>
  <text x="88" y="152" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">User</text>
  <text x="88" y="172" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">Signup / Signin</text>

  <!-- Auth -->
  <rect x="195" y="48" width="120" height="60" rx="12" fill="#1c2333" stroke="url(#purple)" stroke-width="2"/>
  <text x="255" y="76" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Auth</text>
  <text x="255" y="94" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">JWT Secured</text>

  <!-- Wallet -->
  <rect x="195" y="140" width="120" height="70" rx="12" fill="#1c2333" stroke="url(#blue)" stroke-width="2" filter="url(#glow)"/>
  <text x="255" y="166" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Wallet</text>
  <text x="255" y="186" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#00d4aa">Deposit</text>
  <text x="255" y="200" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#ff6b9d">Withdraw / Balance</text>

  <!-- Payments/Transfer -->
  <rect x="195" y="242" width="120" height="70" rx="12" fill="#1c2333" stroke="url(#warm)" stroke-width="2" filter="url(#glow)"/>
  <text x="255" y="272" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Transfer</text>
  <text x="255" y="292" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#ff9f43">Send money</text>
  <text x="255" y="306" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">between users</text>

  <!-- Transaction -->
  <rect x="400" y="140" width="130" height="70" rx="12" fill="#1c2333" stroke="url(#gold)" stroke-width="2"/>
  <text x="465" y="170" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Transaction</text>
  <text x="465" y="192" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">History / Details</text>

  <!-- Ledger -->
  <rect x="585" y="140" width="150" height="70" rx="12" fill="#1c2333" stroke="url(#blue)" stroke-width="2"/>
  <text x="660" y="170" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Ledger Entry</text>
  <text x="660" y="192" text-anchor="middle" font-family="Arial" font-size="10" fill="#00d4aa">Credits / Debits</text>

  <!-- Database -->
  <rect x="430" y="325" width="180" height="56" rx="12" fill="#1c2333" stroke="url(#purple)" stroke-width="2"/>
  <ellipse cx="520" cy="335" rx="80" ry="8" fill="none" stroke="#9966ff" stroke-width="1.5" opacity="0.5"/>
  <text x="520" y="357" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Prisma + PostgreSQL</text>

  <!-- Arrows User to subsystem -->
  <line x1="148" y1="140" x2="193" y2="78" stroke="#9966ff" stroke-width="2"/>
  <line x1="148" y1="155" x2="193" y2="172" stroke="#00b7ff" stroke-width="2"/>
  <line x1="148" y1="175" x2="193" y2="265" stroke="#ff9f43" stroke-width="2"/>

  <!-- Vertical flow within stack -->
  <line x1="255" y1="108" x2="255" y2="138" stroke="#9966ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="255" y1="210" x2="255" y2="240" stroke="#ff9f43" stroke-width="2" marker-end="url(#arrow-warm)"/>

  <!-- Wallet/Transfer to Transaction -->
  <line x1="315" y1="175" x2="398" y2="175" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <line x1="315" y1="277" x2="398" y2="185" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrow-gold)"/>

  <!-- Transaction to Ledger -->
  <line x1="530" y1="175" x2="583" y2="175" stroke="#00b7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Ledger to DB -->
  <line x1="580" y1="300" x2="540" y2="323" stroke="#9966ff" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-purple)"/>
  <!-- Transaction to DB -->
  <line x1="465" y1="210" x2="510" y2="323" stroke="#9966ff" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-purple)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00b7ff"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00d4aa"/>
    </marker>
    <marker id="arrow-warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff9f43"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9966ff"/>
    </marker>
  </defs>

  <!-- Legend -->
  <text x="400" y="410" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">● Auth  ● Wallet  ● Transfer  ● Transaction  ● Ledger  ● PostgreSQL</text>
</svg>
