<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Luxury Wedding Invitation PWA architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1524"/>
      <stop offset="100%" stop-color="#181033"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c86b"/>
      <stop offset="100%" stop-color="#ffd98e"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9966ff"/>
      <stop offset="100%" stop-color="#4f8eff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-family="serif, Arial" font-size="24" font-weight="bold" fill="#f5c86b">💍 Luxury Wedding Invitation</text>
  <text x="400" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9aa3b5">AI-assisted (Cline) full-stack PWA - guest experience + admin panel</text>

  <!-- Guests column -->
  <rect x="30" y="110" width="210" height="150" rx="14" fill="#1c2333" stroke="#f5c86b" stroke-width="2" filter="url(#glow)"/>
  <text x="135" y="136" text-anchor="middle" font-family="Arial" font-size="13" fill="#f5c86b" font-weight="bold">Guests (mobile / web)</text>
  <text x="135" y="160" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">Magical opening (Bismillah)</text>
  <text x="135" y="176" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">Scratch-to-reveal coin</text>
  <text x="135" y="192" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">Story · Events · Venue</text>
  <text x="135" y="208" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">Live countdown</text>
  <text x="135" y="224" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">WhatsApp / Share / Calendar</text>
  <text x="135" y="248" text-anchor="middle" font-family="Arial" font-size="9" fill="#00d4aa">Installable PWA · offline</text>

  <!-- Admin box -->
  <rect x="30" y="285" width="210" height="120" rx="14" fill="#1c2333" stroke="url(#purple)" stroke-width="2"/>
  <text x="135" y="311" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Admin Panel (/admin)</text>
  <text x="135" y="334" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">JWT secure login</text>
  <text x="135" y="350" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">Edit couple · photos · events</text>
  <text x="135" y="366" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">Story · venue · theme · countdown</text>
  <text x="135" y="388" text-anchor="middle" font-family="Arial" font-size="9" fill="#9966ff">Multer photo uploads</text>

  <!-- Backend box -->
  <rect x="300" y="150" width="190" height="190" rx="14" fill="#161b2e" stroke="url(#warm)" stroke-width="2" filter="url(#glow)"/>
  <text x="395" y="178" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Express API</text>
  <text x="395" y="202" text-anchor="middle" font-family="monospace, Arial" font-size="9.5" fill="#ff9f43">/couple · /story</text>
  <text x="395" y="218" text-anchor="middle" font-family="monospace, Arial" font-size="9.5" fill="#ff9f43">/events · /venue</text>
  <text x="395" y="234" text-anchor="middle" font-family="monospace, Arial" font-size="9.5" fill="#ff9f43">/countdown · /family</text>
  <text x="395" y="250" text-anchor="middle" font-family="monospace, Arial" font-size="9.5" fill="#ff9f43">/theme · /upload</text>
  <text x="395" y="276" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">JWT auth middleware</text>
  <text x="395" y="316" text-anchor="middle" font-family="Arial" font-size="10" fill="#9966ff">Routes → Controllers → SQL</text>

  <!-- DB -->
  <rect x="550" y="210" width="200" height="90" rx="14" fill="#1c2333" stroke="url(#gold)" stroke-width="2"/>
  <ellipse cx="650" cy="222" rx="90" ry="8" fill="none" stroke="#f5c86b" stroke-width="1.5" opacity="0.5"/>
  <text x="650" y="248" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">PostgreSQL</text>
  <text x="650" y="268" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">couples · stories · events</text>
  <text x="650" y="284" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#9aa3b5">venues · families · themes · admins</text>

  <!-- Arrows -->
  <line x1="240" y1="180" x2="298" y2="210" stroke="#f5c86b" stroke-width="2" marker-end="url(#gold-arrow)"/>
  <line x1="240" y1="330" x2="298" y2="280" stroke="#9966ff" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#purple-arrow)"/>
  <line x1="490" y1="240" x2="548" y2="248" stroke="#f5c86b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#gold-arrow)"/>

  <defs>
    <marker id="gold-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f5c86b"/>
    </marker>
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9966ff"/>
    </marker>
  </defs>

  <!-- AI / Cline note -->
  <rect x="300" y="370" width="450" height="78" rx="12" fill="#1c2333" stroke="url(#purple)" stroke-width="1.5"/>
  <text x="525" y="396" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffffff" font-weight="bold">Built with AI-assisted coding (Cline)</text>
  <text x="525" y="416" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">From idea to production: project scaffold, components, animations,</text>
  <text x="525" y="434" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">API + admin dashboard generated and iterated with the Cline agent.</text>

  <!-- deploy badges -->
  <text x="400" y="478" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">React 19 · Vite · Tailwind · Framer Motion · GSAP | Express · PostgreSQL · JWT · Multer | Vercel / Render / PM2</text>
</svg>
