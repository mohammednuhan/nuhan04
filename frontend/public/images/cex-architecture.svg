<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="CEX - Centralized Cryptocurrency Exchange architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1524"/>
      <stop offset="100%" stop-color="#181033"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8eff"/>
      <stop offset="100%" stop-color="#9966ff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#4f8eff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="20" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">CEX</text>
  <text x="400" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9aa3b5">Centralized Cryptocurrency Exchange</text>

  <!-- User -->
  <rect x="30" y="150" width="120" height="60" rx="12" fill="#1c2333" stroke="#4f8eff" stroke-width="2"/>
  <text x="90" y="178" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">User</text>
  <text x="90" y="196" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">Signup / Signin</text>

  <!-- Auth -->
  <rect x="200" y="60" width="120" height="60" rx="12" fill="#1c2333" stroke="url(#blue)" stroke-width="2"/>
  <text x="260" y="88" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Auth</text>
  <text x="260" y="106" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">JWT Protected</text>

  <!-- Wallet -->
  <rect x="200" y="170" width="120" height="60" rx="12" fill="#1c2333" stroke="url(#cool)" stroke-width="2"/>
  <text x="260" y="198" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Wallet</text>
  <text x="260" y="216" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">Deposit / Withdraw</text>

  <!-- Orders -->
  <rect x="200" y="280" width="120" height="60" rx="12" fill="#1c2333" stroke="url(#warm)" stroke-width="2"/>
  <text x="260" y="308" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Orders</text>
  <text x="260" y="326" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">Create / View / Delete</text>

  <!-- Order Book -->
  <rect x="390" y="175" width="140" height="74" rx="12" fill="#1c2333" stroke="url(#blue)" stroke-width="2" filter="url(#glow)"/>
  <text x="460" y="200" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Order Book</text>
  <text x="460" y="222" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#ff6b9d">SELL ● Low price first</text>
  <text x="460" y="238" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#00d4aa">BUY  ● High price first</text>

  <!-- Matching -->
  <rect x="590" y="175" width="150" height="74" rx="12" fill="#1c2333" stroke="url(#cool)" stroke-width="2" filter="url(#glow)"/>
  <text x="665" y="202" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Matching</text>
  <text x="665" y="224" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">Buy price ≥ Sell price</text>

  <!-- Database -->
  <rect x="420" y="330" width="160" height="56" rx="12" fill="#1c2333" stroke="url(#cool)" stroke-width="2"/>
  <ellipse cx="500" cy="340" rx="70" ry="8" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.5"/>
  <text x="500" y="362" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">PostgreSQL + Prisma</text>

  <!-- Arrows -->
  <line x1="150" y1="180" x2="198" y2="90" stroke="#4f8eff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="150" y1="180" x2="198" y2="200" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrow-cool)"/>
  <line x1="150" y1="180" x2="198" y2="310" stroke="#ff9f43" stroke-width="2" marker-end="url(#arrow-warm)"/>

  <line x1="320" y1="90" x2="330" y2="160" stroke="#4f8eff" stroke-width="1.5" opacity="0.4"/>
  <line x1="320" y1="200" x2="388" y2="205" stroke="#9966ff" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="320" y1="310" x2="388" y2="225" stroke="#9966ff" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <line x1="530" y1="205" x2="588" y2="205" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrow-cool)"/>

  <line x1="460" y1="175" x2="500" y2="330" stroke="#00d4aa" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-cool)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f8eff"/>
    </marker>
    <marker id="arrow-cool" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00d4aa"/>
    </marker>
    <marker id="arrow-warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff9f43"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9966ff"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text x="705" y="285" text-anchor="middle" font-family="Arial" font-size="10" fill="#9aa3b5">● Auth  ● Wallet  ● Order Book  ● Matching  ● DB</text>
</svg>
